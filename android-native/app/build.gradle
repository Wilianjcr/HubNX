plugins { id 'com.android.application' }
def releaseKeystore = System.getenv('HUBNX_KEYSTORE_FILE')
android {
    namespace 'com.hubnx.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hubnx.app'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.2.6'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('HUBNX_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('HUBNX_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('HUBNX_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.2'
}
