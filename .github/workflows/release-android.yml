name: HubNX Android Release (APK assinado)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar versão do código
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-native/app/build.gradle)
          test -n "$VERSION"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF_NAME" = main || { echo "::error::Dispare a publicação somente a partir da main"; exit 1; }
          else
            TAG="${GITHUB_REF_NAME#v}"
            test "$TAG" = "$VERSION" || { echo "::error::Tag $TAG diferente da versão $VERSION"; exit 1; }
          fi
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Exigir assinatura permanente
        shell: bash
        env:
          KEY_B64: ${{ secrets.HUBNX_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HUBNX_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HUBNX_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HUBNX_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::Configure os quatro secrets de assinatura antes da release"; exit 1;
          }
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/hubnx-release.jks"
          test -s "$RUNNER_TEMP/hubnx-release.jks"
      - name: Preparar interface Android
        run: |
          mkdir -p android-native/app/src/main/assets
          cp -R android/. android-native/app/src/main/assets/
      - name: Compilar APK assinado
        working-directory: android-native
        env:
          HUBNX_KEYSTORE_FILE: ${{ runner.temp }}/hubnx-release.jks
          HUBNX_SIGNING_STORE_PASSWORD: ${{ secrets.HUBNX_SIGNING_STORE_PASSWORD }}
          HUBNX_SIGNING_KEY_ALIAS: ${{ secrets.HUBNX_SIGNING_KEY_ALIAS }}
          HUBNX_SIGNING_KEY_PASSWORD: ${{ secrets.HUBNX_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Conferir assinatura e hash
        shell: bash
        run: |
          APK=android-native/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          TOOL=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$TOOL" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/HubNX-Android.apk
          sha256sum dist/HubNX-Android.apk > dist/SHA256SUMS.txt
      - name: Publicar Release pública
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/HubNX-Android.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "HubNX $RELEASE_TAG" \
            --notes "APK Android assinado. O aplicativo avisa, baixa e solicita autorização para instalar atualizações."
