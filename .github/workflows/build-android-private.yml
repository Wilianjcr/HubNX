name: HubNX Android APK de teste
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'android-native/**'
      - '.github/workflows/build-android-private.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código do HubNX
        uses: actions/checkout@v4
      - name: Conferir sintaxe de scripts web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('android/index.html').read_text(encoding='utf-8')
          start=html.rfind('<script>')
          end=html.find('</script>',start)
          assert start >= 0 and end > start
          Path('/tmp/hubnx-web.js').write_text(html[start+8:end],encoding='utf-8')
          PY
          node --check /tmp/hubnx-web.js
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar Android SDK do executor
        run: |
          test -d "$ANDROID_HOME" || exit 1
          echo "Android SDK: $ANDROID_HOME"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Copiar interface web para o aplicativo Android
        run: |
          mkdir -p android-native/app/src/main/assets
          cp -R android/. android-native/app/src/main/assets/
      - name: Compilar APK debug
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Guardar APK debug como artifact temporário
        uses: actions/upload-artifact@v4
        with:
          name: HubNX-Android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Publicar último build de teste (sem expor credenciais)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BUILT_VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-native/app/build.gradle)
          test -n "$BUILT_VERSION"
          BUILT_SHA="$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B update-channel origin/main
          MAIN_VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-native/app/build.gradle)
          if [ "$MAIN_VERSION" != "$BUILT_VERSION" ]; then
            echo "Main mudou de versão: não publicar manifesto antigo."
            exit 0
          fi
          mkdir -p update
          PREVIOUS=0
          if [ -f update/android-debug.json ]; then
            PREVIOUS=$(jq -r '.run_id // 0' update/android-debug.json)
          fi
          if [ "$PREVIOUS" -gt "$GITHUB_RUN_ID" ]; then
            echo "Já existe uma compilação mais recente."
            exit 0
          fi
          jq -n --arg version "$BUILT_VERSION" --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg sha "$BUILT_SHA" --argjson run_id "$GITHUB_RUN_ID" \
            '{channel:"debug",version:$version,run_id:$run_id,run_url:$run_url,source_sha:$sha,note:"APK de teste, assinatura não estável. Faça backup antes de instalar."}' > update/android-debug.json
          git add update/android-debug.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: apontar canal Android debug para build $GITHUB_RUN_ID [skip ci]"
          git push origin HEAD:main
